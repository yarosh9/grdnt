<svg width="100%" height="100%" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
    <defs><link rel="describedby" type="application/ld+json" href="https://raw.githubusercontent.com/yarosh9/grdnt/refs/heads/master/global_color_map.jsonld" title="Dictionary of Color Semiotics" />
    <link rel="describedby" type="application/ld+json" href="https://raw.githubusercontent.com/yarosh9/grdnt/refs/heads/master/Kluver_formConstants.jsonld" title="Heinrich Klüver's Form Constants" />
    <radialGradient xlink:href="#a" id="e" cx=".5" cy=".5" r=".03" fx=".5" fy=".5" gradientTransform="matrix(1 0 0 .3 0 .1)" gradientUnits="objectBoundingBox" spreadMethod="repeat"/>
    <radialGradient xlink:href="#b" id="f" cx=".5" cy=".5" r=".3" fx=".5" fy=".5"  gradientTransform="matrix(1 0 0 .3 0 .1)" gradientUnits="objectBoundingBox" spreadMethod="reflect"/>
    <linearGradient id="b" x1="0" x2="0" y1="0" y2="1">
