    </linearGradient>
    <linearGradient xlink:href="#a" id="b" x1="0" x2=".125" y1="0" y2="0" spreadMethod="reflect"/>
    <linearGradient xlink:href="#a" id="c" x1="0" x2=".125" y1="0" y2="0" gradientTransform="rotate(90)" spreadMethod="reflect"/>
    <linearGradient id="d" x1="0" x2=".5" y1="0" y2="0" spreadMethod="reflect">
